<!DOCTYPE html>
<!-- Rulează testele de regresie fără consolă: deschide această pagină (sau rulează-o headless) și citește #out.
     Ex.: msedge --headless --window-size=1360,800 --virtual-time-budget=120000 --dump-dom http://localhost:8000/tests/runner.html -->
<html><head><meta charset="utf-8"><title>Teste</title></head>
<body style="margin:0"><pre id="out">running…</pre>
<iframe id="app" src="../index.html?notour" style="position:absolute;left:0;top:0;width:1360px;height:800px;border:0;opacity:0;pointer-events:none"></iframe>
<script>
document.getElementById('app').addEventListener('load', async () => {
  const w = document.getElementById('app').contentWindow, out = document.getElementById('out');
  try {
    await new Promise(r => setTimeout(r, 500));
    const src = await (await fetch('regression.js', { cache: 'reload' })).text();
    const res = await w.eval(src);
    out.textContent = 'RESULT ' + JSON.stringify(res, null, 1);
  } catch (e) { out.textContent = 'RUNNER-ERROR ' + (e && e.stack || e); }
});
</script></body></html>
